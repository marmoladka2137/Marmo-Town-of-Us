name: Verify publication source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check the current publication tree
        shell: bash
        run: |
          set -euo pipefail
          test -f TOU-Marmo.csproj
          test -f tools/Launcher/LauncherForm.cs
          test ! -d Resources/OriginalMotion
          test ! -d Modules/OriginalAnimations
          test ! -d tools/OriginalMotionGenerator
          echo 'Source layout checked. Game, build and multiplayer tests require the documented local environment.'
