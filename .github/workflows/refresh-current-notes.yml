name: Refresh current release documentation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refresh-current-notes.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Update verified package documentation and release description
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          REPO='marmoladka2137/Marmo-Town-of-Us'
          NAME='MTOU-1.1.0-beta-Launcher-Windows.zip'
          TAG='v1.1.0-beta'
          EXPECTED='cc51946a473a0b2ff55b45786f6c3b384485c1b05d79a3e8666db3ba30c12505'
          def api(route,method='GET',data=None):
           args=['gh','api','--method',method,'repos/'+REPO+'/'+route]
           if data is not None:args+=['--input','-']
           r=subprocess.run(args,input=json.dumps(data) if data is not None else None,text=True,capture_output=True,check=True)
           return json.loads(r.stdout) if r.stdout.strip() else None
          r=api('releases/451656718')
          assert r['tag_name']==TAG
          asset=next(a for a in r['assets'] if a['name']==NAME)
          assert asset['digest'] in ('sha256:df366d7c0a88790edea595039ea3fabbd418d00ab5a6dc6b8a7e36fbeb19e87e','sha256:'+EXPECTED)
          data=urllib.request.urlopen('https://raw.githubusercontent.com/'+REPO+'/de713a98ce06a4b5bfe7bd924735d2f848921af1/'+NAME,timeout=90).read()
          assert hashlib.sha256(data).hexdigest()==EXPECTED
          work=Path(os.environ['RUNNER_TEMP'])/'mtou-notes';work.mkdir()
          (work/NAME).write_bytes(data)
          with zipfile.ZipFile(work/NAME) as z:
           assert z.testzip() is None
           assert hashlib.sha256(z.read('Marmo Town of Us.exe')).hexdigest()=='021bf53fb8d18e4fa942c2524e88e3b58de3efc29fa9ed272f391fda468bcb69'
          (work/'SHA256SUMS.txt').write_text(EXPECTED.upper()+'  '+NAME+'\n')
          for name in [NAME,'SHA256SUMS.txt']:
           subprocess.run(['gh','release','upload',TAG,str(work/name),'--repo',REPO,'--clobber'],check=True)
          body='''## [⬇ Download / Pobierz MTOU 1.1.0 Beta](https://github.com/marmoladka2137/Marmo-Town-of-Us/releases/download/v1.1.0-beta/MTOU-1.1.0-beta-Launcher-Windows.zip)
          
          **Game and launcher: 1.1.0 Beta.**
          
          Rozpakuj ZIP, uruchom **Marmo Town of Us.exe**, wybierz Steam lub Epic Games i kliknij **INSTALL MTOU**, następnie **PLAY MTOU**.
          
          Extract the ZIP and run **Marmo Town of Us.exe**. Select your store, install and play. Requires your own compatible Among Us installation. No base game files are included. Every player needs the same mod version.
          
          [Installation](https://github.com/marmoladka2137/Marmo-Town-of-Us/blob/main/INSTALLATION.md) · [Roles](https://github.com/marmoladka2137/Marmo-Town-of-Us/blob/main/ROLES.md) · [Discord](https://dc.gg/mtou)
          
          Windows x64 beta. Epic gameplay and multiplayer regression remain unverified. The unsigned launcher may trigger SmartScreen. Code, launcher executable and mod payload are unchanged; this update simplifies documentation.
          
          Code GPLv3; Marmo artwork CC BY 4.0. Upstream materials retain independent rights; unresolved animation/audio permissions are documented in LICENSE_AUDIT.md. Matching executable source is recorded in installer-manifest.json.
          
          This mod is not affiliated with Among Us or Innersloth LLC, and the content contained therein is not endorsed or otherwise sponsored by Innersloth LLC. Portions of the materials contained herein are property of Innersloth LLC. © Innersloth LLC.
          '''
          api('releases/451656718','PATCH',{'name':'MTOU 1.1.0 Beta','body':body})
          r=api('releases/451656718')
          assert next(a for a in r['assets'] if a['name']==NAME)['digest']=='sha256:'+EXPECTED
          print('Release description and matching download checksum verified.')
          
          PY
