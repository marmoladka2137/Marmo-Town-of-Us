name: Consolidate current MTOU download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/consolidate-downloads-2026-11-19.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtou-download-cleanup-2026-11-19
  cancel-in-progress: false
jobs:
  consolidate:
    if: github.repository == 'marmoladka2137/Marmo-Town-of-Us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: marmoladka2137/Marmo-Town-of-Us
    steps:
      - name: Publish the existing current package before retiring old downloads
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          REPO = 'marmoladka2137/Marmo-Town-of-Us'
          SOURCE = '81045f3619ab86ff3b68835fc474f32740a409b1'
          TAG = 'v1.1.0-beta.19'
          NAME = 'MTOU-Launcher-2.1.0-Windows.zip'
          EXPECTED = '77a8bedc9b08a6e2be84ce60e3461d7eb5823513bad7af7a94240b79bc91a1ea'
          OLD = {450328433: 'v1.1.0-beta.13', 450076537: 'v1.1.0-beta'}
          assert os.environ['GITHUB_REPOSITORY'] == REPO
          def gh(*args, data=None, missing=False):
              result = subprocess.run(['gh', *args], input=json.dumps(data) if data is not None else None,
                                      text=True, capture_output=True)
              if result.returncode:
                  if missing and 'HTTP 404' in result.stderr: return None
                  raise RuntimeError(result.stderr)
              return json.loads(result.stdout) if args[0] == 'api' and result.stdout.strip() else None
          def api(route, method='GET', data=None, missing=False):
              args = ['api', '--hostname', 'github.com', '--method', method, 'repos/'+REPO+'/'+route]
              if data is not None: args += ['--input', '-']
              return gh(*args, data=data, missing=missing)
          def tag_commit():
              ref = api('git/ref/tags/'+TAG, missing=True)
              if not ref: return None
              item = ref['object']
              for _ in range(5):
                  if item['type'] == 'commit': return item['sha']
                  assert item['type'] == 'tag'
                  item = api('git/tags/'+item['sha'])['object']
              raise RuntimeError('Unexpected tag chain')
          known = set(OLD.values()) | {TAG}
          for item in api('releases?per_page=100'):
              if not item['draft'] and item['tag_name'] not in known:
                  raise RuntimeError('Another public release appeared; leaving releases unchanged')
          assert tag_commit() in (None, SOURCE), 'Current tag points to another source revision'
          work = Path(os.environ['RUNNER_TEMP'])/'mtou-download-cleanup'
          work.mkdir(exist_ok=True)
          payload = urllib.request.urlopen('https://raw.githubusercontent.com/'+REPO+'/downloads/'+NAME, timeout=60).read()
          assert hashlib.sha256(payload).hexdigest() == EXPECTED, 'Current package checksum mismatch'
          (work/NAME).write_bytes(payload)
          (work/'SHA256SUMS.txt').write_text(EXPECTED.upper()+'  '+NAME+'\n')
          body = '''## Download / Pobierz

          **[Download MTOU for Windows / Pobierz MTOU](https://github.com/marmoladka2137/Marmo-Town-of-Us/releases/download/v1.1.0-beta.19/MTOU-Launcher-2.1.0-Windows.zip)**

          Rozpakuj ZIP, uruchom **Marmo Town of Us.exe**, wybierz Steam lub Epic Games i kliknij **INSTALL MTOU**. Launcher wykrywa grę i tworzy osobną kopię. Zostaw klienta sklepu uruchomionego.

          Extract the complete ZIP, run **Marmo Town of Us.exe**, select Steam or Epic Games, then choose **INSTALL MTOU**. The launcher detects your locally installed game and prepares a separate modded copy.

          - Game version: **MTOU 1.1.0 Beta**, assembly **1.1.0.19**. Launcher: **2.1.0**.
          - Requires a purchased, compatible Among Us installation. No base-game files are distributed.
          - Verified: launcher setup/path tests, public download/install, Steam startup. Actual Epic gameplay and multiplayer remain unverified.
          - The executable is unsigned; Windows SmartScreen may show an unknown-publisher warning.
          - SHA256SUMS.txt verifies the ZIP. Source code is available under this release's matching tag. Code GPLv3; original Marmo artwork CC BY 4.0; upstream notices retained.

          Community: https://dc.gg/mtou

          This mod is not affiliated with Among Us or Innersloth LLC, and the content contained therein is not endorsed or otherwise sponsored by Innersloth LLC. Portions of the materials contained herein are property of Innersloth LLC. © Innersloth LLC.
          '''
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines())
          release = api('releases/tags/'+TAG, missing=True)
          if release is None:
              release = api('releases', 'POST', dict(tag_name=TAG, target_commitish=SOURCE,
                  name='MTOU 1.1.0 Beta - Launcher 2.1', body=body, draft=True, prerelease=True))
          for path in (work/NAME, work/'SHA256SUMS.txt'):
              assets = api('releases/'+str(release['id'])+'/assets')
              existing = next((a for a in assets if a['name'] == path.name), None)
              digest = 'sha256:'+hashlib.sha256(path.read_bytes()).hexdigest()
              if existing:
                  assert existing['size'] == path.stat().st_size and existing.get('digest') == digest, 'Existing asset differs'
              else:
                  gh('release', 'upload', TAG, str(path), '--repo', REPO)
          release = api('releases/'+str(release['id']), 'PATCH', dict(draft=False, prerelease=True,
              name='MTOU 1.1.0 Beta - Launcher 2.1', body=body))
          assert not release['draft'] and tag_commit() == SOURCE
          assets = api('releases/'+str(release['id'])+'/assets')
          package = next(a for a in assets if a['name'] == NAME)
          assert package.get('digest') == 'sha256:'+EXPECTED and package['size'] == len(payload)
          for release_id, expected_tag in OLD.items():
              old = api('releases/'+str(release_id), missing=True)
              if old is None: continue
              assert old['id'] == release_id and old['tag_name'] == expected_tag
              api('releases/'+str(release_id), 'DELETE')
          remaining = [r for r in api('releases?per_page=100') if not r['draft']]
          assert len(remaining) == 1 and remaining[0]['tag_name'] == TAG
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Kept one current release: '+release['html_url']+'\n\nOld release downloads retired; source history and tags preserved.\n')
          PY
