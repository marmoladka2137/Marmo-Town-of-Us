name: Publish current unified beta download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/current-beta-2026-11-19.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtou-current-beta-2026-11-19
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'marmoladka2137/Marmo-Town-of-Us'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify and publish the current beta
        shell: bash
        run: |
          python3 - <<'PY'
          import sys,traceback
          def report_exception(kind,error,tb):
              message=''.join(traceback.format_exception(kind,error,tb)).replace('%','%25').replace('\n','%0A').replace('\r','%0D')
              print('::error title=Publication failed::'+message,flush=True)
          sys.excepthook=report_exception
          import hashlib,json,os,subprocess,urllib.request,zipfile
          from pathlib import Path
          REPO='marmoladka2137/Marmo-Town-of-Us'
          SOURCE='4fdab8f0fc7897e52c34123ab7a27927e4784e80'
          DOWNLOADS='489e279297c529648141af470bce10cc902a2b17'
          NAME='MTOU-1.1.0-beta-Launcher-Windows.zip'
          TAG='v1.1.0-beta'
          EXPECTED='df366d7c0a88790edea595039ea3fabbd418d00ab5a6dc6b8a7e36fbeb19e87e'
          assert os.environ['GITHUB_REPOSITORY']==REPO
          def gh(*args,data=None,missing=False):
           r=subprocess.run(['gh',*args],input=json.dumps(data) if data is not None else None,text=True,capture_output=True)
           if r.returncode:
            if missing and 'HTTP 404' in r.stderr:return None
            raise RuntimeError(r.stderr)
           return json.loads(r.stdout) if args[0]=='api' and r.stdout.strip() else None
          def api(route,method='GET',data=None,missing=False):
           args=['api','--hostname','github.com','--method',method,'repos/'+REPO+'/'+route]
           if data is not None:args+=['--input','-']
           return gh(*args,data=data,missing=missing)
          release=api('releases/451656718')
          assert release['tag_name']=='v1.1.0-beta.19'
          assert not release['draft']
          assert {a['name'] for a in release['assets']}=={'MTOU-Launcher-2.1.0-Windows.zip','SHA256SUMS.txt'}
          ref=api('git/ref/tags/'+TAG,missing=True)
          assert ref is None or ref['object']['sha']==SOURCE
          work=Path(os.environ['RUNNER_TEMP'])/'mtou-current'
          work.mkdir()
          payload=urllib.request.urlopen('https://raw.githubusercontent.com/'+REPO+'/'+DOWNLOADS+'/'+NAME,timeout=90).read()
          assert hashlib.sha256(payload).hexdigest()==EXPECTED
          (work/NAME).write_bytes(payload)
          with zipfile.ZipFile(work/NAME) as z:
           m=json.loads(z.read('installer-manifest.json'))
           assert m['LauncherVersion']=='1.1.0 Beta' and m['LauncherSourceCommit']==SOURCE
           assert m['Payload']['Sha256']=='D3E2EF74C183B32ADEC013CD172869A9C8D628913D85B8671E0D686FAAB0141E'
           assert not any(n.endswith('Among Us.exe') for n in z.namelist())
          (work/'SHA256SUMS.txt').write_text(EXPECTED.upper()+'  '+NAME+'\n')
          # Upload and verify the replacement before removing any existing download.
          gh('release','upload',release['tag_name'],str(work/NAME),'--repo',REPO)
          fresh=api('releases/451656718')
          asset=next(a for a in fresh['assets'] if a['name']==NAME)
          assert asset['size']==len(payload) and asset['digest']=='sha256:'+EXPECTED
          if ref is None:api('git/refs','POST',{'ref':'refs/tags/'+TAG,'sha':SOURCE})
          body='''## MTOU 1.1.0 Beta — 2026-11-19
          
          ### [⬇ Pobierz / Download for Windows](https://github.com/marmoladka2137/Marmo-Town-of-Us/releases/download/v1.1.0-beta/MTOU-1.1.0-beta-Launcher-Windows.zip)
          
          Gra i launcher mają tę samą wersję: **1.1.0 Beta**.
          
          Rozpakuj cały ZIP, uruchom **Marmo Town of Us.exe**, wybierz Steam lub Epic Games i kliknij **INSTALL MTOU**, a następnie **PLAY MTOU**.
          
          Extract the complete ZIP, run **Marmo Town of Us.exe**, choose Steam/Epic, install and play. Requires your own legally installed Among Us; no base game is distributed. Keep the storefront client running.
          
          Launcher source: https://github.com/marmoladka2137/Marmo-Town-of-Us/tree/4fdab8f0fc7897e52c34123ab7a27927e4784e80
          Matching mod source is separately recorded in installer-manifest.json. Mod payload and dependency pins remain unchanged. Internal file revision: 1.1.0.19.
          
          Launcher build succeeded; 26 discovery/process, 11 setup and 29 update fixtures passed. Epic gameplay, real multiplayer, full role regression and SUS Modder integration remain unverified. The unsigned launcher may trigger SmartScreen. Native upstream resource permissions remain unresolved as documented in LICENSE_AUDIT.md; publication does not imply legal clearance or moderator acceptance.
          
          This mod is not affiliated with Among Us or Innersloth LLC, and the content contained therein is not endorsed or otherwise sponsored by Innersloth LLC. Portions of the materials contained herein are property of Innersloth LLC. © Innersloth LLC.
          '''
          api('releases/451656718','PATCH',{'tag_name':TAG,'name':'MTOU 1.1.0 Beta','body':body,'prerelease':True})
          gh('release','upload',TAG,str(work/'SHA256SUMS.txt'),'--repo',REPO,'--clobber')
          fresh=api('releases/451656718')
          assert fresh['tag_name']==TAG and fresh['name']=='MTOU 1.1.0 Beta'
          for a in fresh['assets']:
           if a['name']=='MTOU-Launcher-2.1.0-Windows.zip':
            assert a['digest']=='sha256:77a8bedc9b08a6e2be84ce60e3461d7eb5823513bad7af7a94240b79bc91a1ea'
            api('releases/assets/'+str(a['id']),'DELETE')
          # Preserve all commits and branch history; retire only explicitly superseded tags.
          for tag in ['v1.1.0-beta.19','v1.1.0-beta.13']:
           old=api('git/ref/tags/'+tag,missing=True)
           if old:
            assert tag!='v1.1.0-beta.19' or old['object']['sha']=='81045f3619ab86ff3b68835fc474f32740a409b1'
            api('git/refs/tags/'+tag,'DELETE')
          final=api('releases/451656718')
          assert {a['name'] for a in final['assets']}=={NAME,'SHA256SUMS.txt'}
          print('Verified current version, package, source tag and release download; commit history preserved.')
          
          PY
