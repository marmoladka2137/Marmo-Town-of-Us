name: Publish matching beta source
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mtou-first-beta-publication
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'marmoladka2137/Marmo-Town-of-Us' && github.actor == 'marmoladka2137'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Download audited source from the owner's draft
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mtou-publication"
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/mtou-publication/releases.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mtou-publication"
          matches=[r for r in json.loads((p/"releases.json").read_text()) if r["tag_name"]=="mtou-publication-staging" and r["draft"]]
          assert len(matches)==1,"Expected exactly one owner-prepared draft"
          (p/"release-id").write_text(str(matches[0]["id"]))
          PY
          rid=$(cat "$RUNNER_TEMP/mtou-publication/release-id")
          gh api "repos/$GH_REPO/releases/$rid/assets" > "$RUNNER_TEMP/mtou-publication/assets.json"
          aid=$(python3 -c 'import json,sys; a=[x for x in json.load(open(sys.argv[1])) if x["name"]=="MTOU-1.1.0-beta-source.zip"]; assert len(a)==1; print(a[0]["id"])' "$RUNNER_TEMP/mtou-publication/assets.json")
          gh api -H "Accept: application/octet-stream" "repos/$GH_REPO/releases/assets/$aid" > "$RUNNER_TEMP/mtou-publication/source.zip"
          echo "C0FE3C8556035D84DB4252AA91005CC4AA8C5E8016389F7A9DF6A5A9D318014E  $RUNNER_TEMP/mtou-publication/source.zip" | sha256sum --check
      - name: Materialize the complete source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile
          from pathlib import Path
          root=Path.cwd().resolve()
          archive=Path(os.environ["RUNNER_TEMP"])/"mtou-publication/source.zip"
          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  if item.is_dir(): continue
                  parts=Path(item.filename).parts
                  assert parts and parts[0]=="Marmo-Town-of-Us"
                  relative=Path(*parts[1:])
                  assert relative.parts and not ({".git",".github","bin","obj"} & set(relative.parts))
                  target=(root/relative).resolve()
                  assert target.is_relative_to(root)
                  assert target.suffix.lower() not in {".dll",".exe",".pdb",".log",".mp3",".wav"}
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(z.read(item))
          assert (root/"TOU-Marmo.csproj").is_file()
          assert len(list((root/"Resources/OriginalMotion").rglob("*.png")))==1511
          PY
          git config user.name "marmoladka2137"
          git config user.email "249504836+marmoladka2137@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && { echo "No source changes staged"; exit 1; }
          git commit -m "Publish Marmo Town of Us 1.1.0-beta source and documentation"
          git push origin HEAD:main
          if git ls-remote --exit-code --tags origin refs/tags/v1.1.0-beta >/dev/null 2>&1; then
            echo "Release tag already exists; refusing to replace it"
            exit 1
          fi
          git tag -a v1.1.0-beta -m "Marmo Town of Us 1.1.0 Beta"
          git push origin refs/tags/v1.1.0-beta
      - name: Publish the beta with its matching source tag
        shell: bash
        run: |
          set -euo pipefail
          rid=$(cat "$RUNNER_TEMP/mtou-publication/release-id")
          gh api --method PATCH "repos/$GH_REPO/releases/$rid" \
            -f tag_name=v1.1.0-beta -f target_commitish="$(git rev-parse HEAD)" \
            -f name="Marmo Town of Us 1.1.0 Beta" -F draft=false -F prerelease=true > "$RUNNER_TEMP/mtou-publication/published.json"
          python3 - <<'PY'
          import os,json
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"])/"mtou-publication/published.json"
          r=json.loads(p.read_text())
          assert not r["draft"] and r["prerelease"] and r["tag_name"]=="v1.1.0-beta"
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("Published matching beta source and assets: "+r["html_url"]+"\n")
          PY
